services:
  db:
    image: postgres:15
    container_name: tablebook-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tabledb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tablebook-network
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tablebook-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tabledb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - tablebook-network
volumes:
  postgres_data:
networks:
  tablebook-network:
    driver: bridge